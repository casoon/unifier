[package]
name = "unifier"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
description = "Constraint satisfaction / optimization (CSP/COP) modeling and solver framework for Rust, built on pathwise"
license = "MIT"
repository = "https://github.com/casoon/unifier"
readme = "README.md"
keywords = ["csp", "constraint-solver", "optimization", "scheduling"]
categories = ["algorithms", "mathematics"]

[dependencies]
pathwise = { version = "0.1.0", path = "../pathwise" }

[dev-dependencies]
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "solver_benches"
harness = false

